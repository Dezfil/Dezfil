name: CI

# Three gates, tiered by cost.
#
#   checks   fast static lane: lint, types, unit tests. Every pull request
#            and every push to main. Around twenty minutes.
#   secrets  gitleaks over the working tree. Everywhere; it is cheap.
#   image    black-box lane: build the container and drive it headlessly with
#            no network. Only on main, because it builds a full image.
#
# The end-to-end browser suite is not one of them: it runs locally, against an
# instance you provision yourself. CONTRIBUTING.md and docs/contribute/development-setup.md say how.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job below writes to the repository, so
# nothing raises this.
permissions:
  contents: read

# Supersede in-flight runs for the same pull request, but never cancel a run
# on the default branch: main's history has to be checked commit by commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bumping this invalidates the tippecanoe binary cache below.
  TIPPECANOE_VERSION: 2.79.0

jobs:
  # Fast lane - runs on every push and pull request. Lint, types, unit tests.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Some unit tests build tiles against the real tiler. Cache the compiled
      # binary by version so we don't recompile it from source every run.
      - name: Cache the tippecanoe binary
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ runner.os }}-${{ env.TIPPECANOE_VERSION }}
      - name: Build tippecanoe (only on a cache miss)
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev zlib1g-dev
          curl -fsSL "https://github.com/felt/tippecanoe/archive/refs/tags/${TIPPECANOE_VERSION}.tar.gz" | tar -xz -C /tmp
          make -C "/tmp/tippecanoe-${TIPPECANOE_VERSION}" -j"$(nproc)" tippecanoe
          mkdir -p "$HOME/tippecanoe-bin"
          install "/tmp/tippecanoe-${TIPPECANOE_VERSION}/tippecanoe" "$HOME/tippecanoe-bin/tippecanoe"
      - name: Put tippecanoe on PATH
        run: |
          echo "$HOME/tippecanoe-bin" >> "$GITHUB_PATH"
          "$HOME/tippecanoe-bin/tippecanoe" --version
      # Some unit tests read through the engine's own extensions, such as
      # httpfs for an object store, and never install one themselves. A new
      # runner has none, so install the image's list once where the engine
      # looks by default, cached by that list and the locked engine version.
      - name: Cache the DuckDB extensions
        id: duckdb-extensions-cache
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ hashFiles('scripts/duckdb-extensions.mjs', 'package-lock.json') }}
      - name: Install the DuckDB extensions (only on a cache miss)
        if: steps.duckdb-extensions-cache.outputs.cache-hit != 'true'
        run: node scripts/install-duckdb-extensions.mjs "$HOME/.duckdb/extensions"
      - run: npm run lint
      # A clean type check of this tree needs about 2.5 GB of heap (5,250
      # files, 600,000 types). Node's default on the runner is smaller, so
      # the step died out of memory on every run since early October.
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # A NUL byte makes git and grep treat a source file as binary: it
      # disappears from text search and from reviewable diffs.
      - run: npm run lint:hygiene
      # This tree was published from a private history. Nothing in it may cite
      # a planning document, a tracking row or a folder the repository does not
      # carry - the commit-message guard reads messages and the served-contract
      # guard reads API descriptions, so neither can see a citation sitting in
      # a source comment or a report label.
      - run: npm run lint:citations
      # Every setting the server reads must have one row in the settings tables
      # the configuration page links, and every row there must be a setting
      # the server reads, so the documented surface and the real one cannot
      # drift apart silently.
      - run: npm run lint:readme
      # The decomposition tripwire: a handful of oversized modules must not
      # grow. Growing one means raising its recorded ceiling in the same diff,
      # which is an explicit reviewable decision rather than silent drift.
      - run: npm run lint:size
      # Nothing that belongs to a development-only surface may reach a
      # production build.
      - run: npm run lint:stage-edge
      # The design system's ratified vocabulary - type ramp, radius family,
      # motion timings, tokens, drawn glyphs, focus rings, accessible names -
      # held against a committed inventory so it cannot regress one
      # unreviewed literal at a time.
      - run: npm run lint:wheelhouse
      - run: npm run lint:tokens
      - run: npm run lint:icons
      # Two module stylesheets that set one property on the same element at
      # equal specificity are decided by the order the build emits them in,
      # and a production build orders them differently from development.
      - run: npm run lint:class-pairs
      # The design specimen page is generated from the component library and
      # never hand-synced. This fails when a shipped token, kit stylesheet or
      # palette changes without regenerating the page.
      - run: npm run lint:specimen
      # Reader counts, catalogue and examples stay aligned with the contract.
      - run: npm run lint:contract-docs
      - run: npm run lint:reader-docs
      # The shipped plugin guidance stays current.
      - run: npm run lint:plugin
      # Every documentation page holds the page contract (frontmatter,
      # headings, links, pictures, addresses), the image manifest matches its
      # files, and the generated index and API description file are current.
      - run: npm run lint:docs
      # No tracked file names a documentation path that moved or left.
      - run: npm run lint:retired-paths
      # A hosted runner runs the suite under more load than a developer
      # machine, and each of the first runs here had a different
      # timing-bound case run past its limit, each passing in the others.
      # One retry absorbs that: a case that fails twice still fails the job,
      # and the output marks a case that needed its retry.
      - run: npm test -- --retry=1
        env:
          # The authenticated test fixtures refuse to run without an
          # explicit scratch data directory, so no suite can ever touch
          # a real one. The runner provides a throwaway path.
          DEZFIL_DATA_DIR: ${{ runner.temp }}/dezfil-test-data
      - name: Storage proof driver controls
        run: node --test scripts/storage-volume.test.mjs
      - name: Native socket provenance and missing-preload refusal
        run: |
          DEZFIL_TRUSTED_PROXIES=127.0.0.1 node --import=./scripts/ingress-preload.mjs scripts/ingress-probe.mjs
          node scripts/ingress-probe.mjs --expect-missing

  # Secret scan - cheap, so it runs everywhere. The working tree is scanned
  # rather than the history, which is what the fingerprints in .gitleaksignore
  # are computed against. That file carries the synthetic credentials our own
  # tests assert on, plus some baseline hashes the generic rule mistakes for
  # keys; it excludes findings, never whole paths.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the working tree for secrets
        run: gitleaks dir . --no-banner --redact --exit-code 1

  # Black-box gate - build the real image and drive it headlessly. Runs only
  # when a change lands on main: it builds a full container, which is too slow
  # and too cache-hostile to put in front of every pull request.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dezfil:ci .
      - name: Record image size
        run: |
          docker image ls dezfil:ci --format 'Image size: {{.Size}}'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The artifact we ship contains what we say and nothing else: /app must
      # match the checked-in allowlist, with no repository metadata, no data
      # and no key material anywhere inside.
      - name: Runtime image inventory matches the allowlist
        run: node scripts/check-image-inventory.mjs dezfil:ci
      # Reuses the built image for the app and three helpers. The driver owns
      # both internal networks and always removes its exact resource names.
      # Expect about 30 added seconds, against outside measurements of 27–29 s;
      # record the hosted runner's actual elapsed time. Wider probes stay outside.
      - name: Render destination gate, both three-arm variants
        run: |
          DEZFIL_DATA_DIR=$(mktemp -d "$RUNNER_TEMP/dezfil-render-XXXXXX") \
            node scripts/render-egress-driver.mjs --image dezfil:ci
      - name: Provision the separate stock MCP probe client
        run: |
          mcp_client_version=$(node -p "require('./package-lock.json').packages['node_modules/@modelcontextprotocol/client'].version")
          docker build -f scripts/mcp-probe-client.Dockerfile --build-arg MCP_CLIENT_VERSION="$mcp_client_version" -t dezfil-mcp-probe:ci .
      # Measured driver time: 7 seconds for --quick, 47 seconds for --full,
      # excluding the build and a cold source image pull. Runs the forty-row
      # refusal, exact SQL result admission, and SQL, inspection and
      # geometry-choice cell boundaries. The three-minute timeout leaves room
      # for slower workers; elapsed time is printed by the driver.
      # PostGIS and the full four-reader result/geometry/export matrix remain the
      # outside --full proof in scripts/query-result-budget-probe.md.
      # Invocation-owned containers and anonymous volumes are always removed.
      - name: Source-free result-byte boundaries
        timeout-minutes: 3
        run: sh scripts/result-budget-image.sh dezfil:ci --quick
      - name: JSON and MCP bounds, whole uploads, paced public refusals and file limits
        run: |
          run_transport() {
            mode="$1"; port="$2"; cap="$3"
            docker run -d --rm --name dezfil-transport-ci --network=none \
              -e PORT="$port" -e DEZFIL_DATA_DIR=/data -e DEZFIL_UPLOAD_MAX_MB="$cap" \
              -e DEZFIL_AI_PROVIDER=openai -e OPENAI_API_KEY=scripted-wire \
              -v "$PWD/scripts:/probes:ro" dezfil:ci \
              sh -c 'exec node --import=./scripts/ingress-preload.mjs server.js > /data/transport-server.log 2>&1'
            for i in $(seq 1 30); do
              if docker exec dezfil-transport-ci node -e "fetch('http://127.0.0.1:$port/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                break
              fi
              sleep 1
            done
            if [ "$mode" = file-limit ]; then
              docker exec dezfil-transport-ci node /probes/transport-probe.mjs \
                "http://127.0.0.1:$port" --server-log /data/transport-server.log --file-limit-only
            else
              # Arrival only exists with external sign-in configured, so its bounds
              # are probed on a second instance beside the first. The key is
              # synthetic: the probe sends no ticket and never contacts the service.
              external_port=3393
              sign_in_key=$(docker run --rm --network=none dezfil:ci node -e "console.log(require('node:crypto').generateKeyPairSync('ed25519').publicKey.export({format:'jwk'}).x)")
              docker run -d --rm --name dezfil-external-ci --network=container:dezfil-transport-ci \
                -e PORT="$external_port" -e DEZFIL_DATA_DIR=/data \
                -e DEZFIL_EXTERNAL_SIGN_IN_KEYS="$sign_in_key" \
                -e DEZFIL_EXTERNAL_SIGN_IN_AUDIENCE=body-probe \
                -e DEZFIL_EXTERNAL_SIGN_IN_URL=http://127.0.0.1:3899/sign-in \
                -e DEZFIL_EXTERNAL_SIGN_IN_OWNER_ID=body-probe-owner \
                -e DEZFIL_EXTERNAL_SIGN_IN_OWNER_EMAIL=owner@example.test \
                dezfil:ci sh -c 'exec node --import=./scripts/ingress-preload.mjs server.js'
              for i in $(seq 1 30); do
                if docker exec dezfil-transport-ci node -e "fetch('http://127.0.0.1:$external_port/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                  break
                fi
                sleep 1
              done
              docker run --rm --network=container:dezfil-transport-ci \
                --volumes-from dezfil-transport-ci -e DEZFIL_DATA_DIR=/data \
                -v "$PWD/scripts:/probe/scripts:ro" dezfil-mcp-probe:ci \
                node /probe/scripts/body-probe.mjs "http://127.0.0.1:$port" \
                --server-log /data/transport-server.log \
                --external-origin "http://127.0.0.1:$external_port"
              docker stop dezfil-external-ci
            fi
            docker stop dezfil-transport-ci
          }
          trap 'docker exec dezfil-transport-ci cat /data/transport-server.log 2>/dev/null || true; docker stop dezfil-external-ci 2>/dev/null || true; docker stop dezfil-transport-ci 2>/dev/null || true' EXIT
          run_transport transport 3391 257
          run_transport file-limit 3392 1
      # Direct/proxy source separation and sharing, refusals, expiry and missing ingress.
      # No capacity burst: a hosted runner cannot fill 10,000 entries inside one
      # ten-second window. Run the explicit --capacity arm locally for that proof.
      - name: Published direct/proxy source separation, refusals, expiry and missing ingress
        run: |
          run_publication() {
            mode="$1"; port="$2"; trusted="$3"
            if [ "$mode" = missing ]; then preload=""; else preload="--import=./scripts/ingress-preload.mjs"; fi
            docker run -d --rm --name dezfil-publication-ci --network=none \
              -e PORT="$port" -e DEZFIL_DATA_DIR=/data -e DEZFIL_TRUSTED_PROXIES="$trusted" \
              -e DEZFIL_PUBLIC_RATE_LIMIT=4 -e DEZFIL_PUBLIC_TILE_RATE_LIMIT=2 \
              -e DEZFIL_TEST_PUBLICATION_LOG=/data/publication.ndjson \
              -v "$PWD/scripts:/probes:ro" dezfil:ci \
              node $preload --import=/probes/publication-observer.mjs server.js
            for i in $(seq 1 30); do
              if docker exec dezfil-publication-ci node -e "fetch('http://127.0.0.1:$port/api/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"; then break; fi
              sleep 1
            done
            docker exec dezfil-publication-ci node /probes/publication-source-probe.mjs \
              "http://127.0.0.1:$port" "$mode" --state-log /data/publication.ndjson
            docker stop dezfil-publication-ci
            # --rm removes the container after stop returns; the next arm reuses the name.
            for i in $(seq 1 50); do docker container inspect dezfil-publication-ci >/dev/null 2>&1 || break; sleep 0.2; done
          }
          trap 'docker logs dezfil-publication-ci 2>/dev/null || true; docker stop dezfil-publication-ci 2>/dev/null || true' EXIT
          run_publication direct 3393 ""
          run_publication trusted 3394 127.0.0.1
          run_publication untrusted 3395 ""
          run_publication missing 3396 ""
      - name: Shared derivation bounds, busy recovery and native timing
        run: |
          docker run -d --rm --name dezfil-derivation-ci --network=none \
            -e PORT=3397 -e DEZFIL_DATA_DIR=/data -e DEZFIL_TRUSTED_PROXIES=127.0.0.1 \
            -e DEZFIL_TEST_DERIVATION_LOG=/data/derivations.ndjson \
            -v "$PWD/scripts:/probes:ro" dezfil:ci \
            node --import=./scripts/ingress-preload.mjs --import=/probes/derivation-observer.mjs server.js
          trap 'docker logs dezfil-derivation-ci 2>/dev/null || true; docker stop dezfil-derivation-ci 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if docker exec dezfil-derivation-ci node -e "fetch('http://127.0.0.1:3397/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 1
          done
          docker exec dezfil-derivation-ci node /probes/derivation-probe.mjs \
            http://127.0.0.1:3397 --state-log /data/derivations.ndjson
          docker stop dezfil-derivation-ci
      - name: Full-volume admission, fencing and recovery on bounded tmpfs
        timeout-minutes: 6
        run: |
          DEZFIL_DATA_DIR=$(mktemp -d "$RUNNER_TEMP/dezfil-storage-XXXXXX") \
            node scripts/storage-volume-driver.mjs --container dezfil:ci --port 3409
      - name: Credential cleanup, live authentication and replacement containers
        run: |
          DEZFIL_DATA_DIR=$(mktemp -d "$RUNNER_TEMP/dezfil-cleanup-XXXXXX") \
            node scripts/credential-cleanup-driver.mjs --container dezfil:ci --port 3398
      - name: Packaged native socket provenance
        run: |
          docker run --rm --network=none -e DEZFIL_TRUSTED_PROXIES=127.0.0.1 \
            -v "$PWD/scripts:/probes:ro" dezfil:ci \
            node --import=/app/scripts/ingress-preload.mjs /probes/ingress-probe.mjs
          docker run --rm --network=none -v "$PWD/scripts:/probes:ro" dezfil:ci \
            node /probes/ingress-probe.mjs --expect-missing
      # Every supported DuckDB extension is baked into the image and loads
      # with the network disabled, so an air-gapped instance degrades rather
      # than breaks.
      - name: Baked DuckDB extensions load offline
        run: |
          docker run --rm --network=none \
            -v "$PWD/scripts:/scripts:ro" \
            dezfil:ci node /scripts/check-duckdb-extensions-offline.mjs
      - name: Cold start within the documented bound (30s)
        run: |
          # The journey's loopback fixture and the server's own browser must
          # share a network namespace, and neither gets a public network.
          docker run -d --rm --name dezfil-ci --network=none \
            -e PORT=3183 -e DEZFIL_RENDER_CAP_FEATURES=2000 \
            -e DEZFIL_EGRESS_ALLOWLIST=127.0.0.1 \
            -v "$PWD/scripts:/probes:ro" \
            -v dezfil-ci-data:/data dezfil:ci
          start=$(date +%s)
          for i in $(seq 1 30); do
            if docker exec dezfil-ci node -e "fetch('http://127.0.0.1:3183/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo
              echo "Ready after $(( $(date +%s) - start ))s"
              exit 0
            fi
            sleep 1
          done
          echo "Not ready within 30s" >&2
          docker logs dezfil-ci
          docker stop dezfil-ci
          exit 1
      # Setup and token creation happen before the protected API description.
      - name: Authenticated headless journey without external networking
        run: docker exec dezfil-ci node /probes/journey.mjs http://127.0.0.1:3183
      - name: Seed authenticated durability before container replacement
        run: docker exec dezfil-ci node /probes/durability.mjs seed http://127.0.0.1:3183 /data/durability-state.json
      - name: Replace container and check live and revoked credentials
        run: |
          docker stop dezfil-ci
          # --rm removes the container after stop returns; wait until the name is free.
          for i in $(seq 1 50); do docker container inspect dezfil-ci >/dev/null 2>&1 || break; sleep 0.2; done
          docker run -d --rm --name dezfil-ci --network=none \
            -e PORT=3183 -e DEZFIL_RENDER_CAP_FEATURES=2000 \
            -e DEZFIL_EGRESS_ALLOWLIST=127.0.0.1 \
            -v "$PWD/scripts:/probes:ro" -v dezfil-ci-data:/data dezfil:ci
          for i in $(seq 1 30); do
            if docker exec dezfil-ci node -e "fetch('http://127.0.0.1:3183/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          docker exec dezfil-ci node /probes/durability.mjs verify http://127.0.0.1:3183 /data/durability-state.json
      # The account journeys, each on a fresh store of its own: what a person
      # owns stays theirs (an admin and two people), and a project shares
      # exactly what it files (an owner, a Viewer, an Editor and a stranger,
      # the assistant's tool path read over a scripted model wire). Each
      # seeds, the container is replaced over the same volume, and it
      # verifies again with the saved credentials. They run from the probe
      # client in the instance's network namespace: they drive MCP too.
      - name: Ownership journey across a container replacement
        run: |
          mkdir -p "$RUNNER_TEMP/journeys"
          chmod 777 "$RUNNER_TEMP/journeys"
          start() {
            docker run -d --name dezfil-ownership-ci --network=none \
              -e PORT=3383 -e DEZFIL_RENDER_CAP_FEATURES=2000 \
              -e DEZFIL_EGRESS_ALLOWLIST=127.0.0.1 \
              -v dezfil-ownership-ci-data:/data dezfil:ci
            for i in $(seq 1 30); do
              if docker exec dezfil-ownership-ci node -e "fetch('http://127.0.0.1:3383/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                return 0
              fi
              sleep 1
            done
            docker logs dezfil-ownership-ci
            return 1
          }
          journey() {
            docker run --rm --network=container:dezfil-ownership-ci \
              -v "$PWD/scripts:/probe/scripts:ro" -v "$RUNNER_TEMP/journeys:/state" \
              dezfil-mcp-probe:ci node /probe/scripts/ownership-journey.mjs \
              "$1" http://127.0.0.1:3383 /state/ownership-state.json
          }
          # The server is removed here rather than by --rm, so a failed
          # journey can still show what the server logged.
          trap 'status=$?
            if [ "$status" -ne 0 ]; then
              docker inspect -f "server: {{.State.Status}}, exit {{.State.ExitCode}}, out of memory {{.State.OOMKilled}}" dezfil-ownership-ci || true
              docker logs -t dezfil-ownership-ci 2>&1 | tail -n 200 || true
            fi
            docker rm -f dezfil-ownership-ci >/dev/null 2>&1 || true' EXIT
          start
          journey seed
          docker stop dezfil-ownership-ci
          docker rm dezfil-ownership-ci
          start
          journey verify
          docker stop dezfil-ownership-ci
      - name: Sharing journey across a container replacement
        run: |
          mkdir -p "$RUNNER_TEMP/journeys"
          chmod 777 "$RUNNER_TEMP/journeys"
          start() {
            docker run -d --rm --name dezfil-sharing-ci --network=none \
              -e PORT=3384 -e DEZFIL_RENDER_CAP_FEATURES=2000 \
              -e DEZFIL_EGRESS_ALLOWLIST=127.0.0.1 \
              -e DEZFIL_AI_PROVIDER=openai -e OPENAI_API_KEY=scripted-wire \
              -e OPENAI_BASE_URL=http://127.0.0.1:3341/v1 \
              -e NODE_OPTIONS=--import=/probes/sharing-leave-observer.mjs \
              -v "$PWD/scripts:/probes:ro" -v dezfil-sharing-ci-data:/data dezfil:ci
            for i in $(seq 1 30); do
              if docker exec dezfil-sharing-ci node -e "fetch('http://127.0.0.1:3384/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                return 0
              fi
              sleep 1
            done
            docker logs dezfil-sharing-ci
            return 1
          }
          journey() {
            docker run --rm --network=container:dezfil-sharing-ci \
              -v "$PWD/scripts:/probe/scripts:ro" -v "$RUNNER_TEMP/journeys:/state" \
              -v dezfil-sharing-ci-data:/data \
              dezfil-mcp-probe:ci node /probe/scripts/sharing-journey.mjs \
              "$1" http://127.0.0.1:3384 /state/sharing-state.json --assistant-wire=3341 --leave-hold=/data/.leave-probe
          }
          start
          journey seed
          docker stop dezfil-sharing-ci
          # --rm removes the container after stop returns; wait until the name is free.
          for i in $(seq 1 50); do docker container inspect dezfil-sharing-ci >/dev/null 2>&1 || break; sleep 0.2; done
          start
          journey verify
          docker stop dezfil-sharing-ci
      - name: Stop the account journey containers
        if: always()
        run: docker stop dezfil-ownership-ci dezfil-sharing-ci 2>/dev/null || true
      # Expected added time: 1-3 minutes, excluding the image build. Measure
      # the outside mirror before release and correct this range from that run.
      # Uses the built image, no database image pull and no browser. The driver
      # removes every owned container/volume on every exit and waits for names.
      - name: Account deletion, built pages and continuation across replacement
        timeout-minutes: 5
        run: |
          DEZFIL_DATA_DIR=$(mktemp -d "$RUNNER_TEMP/account-deletion-XXXXXX") \
            sh scripts/account-deletion-image.sh dezfil:ci
      - name: MCP restart, HTTP departure and notification characterization
        run: node scripts/mcp-process-driver.mjs --container dezfil:ci --client-image dezfil-mcp-probe:ci --port 3377
      - name: Installed plugin HTTP journey
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-renders"
          chmod 777 "$RUNNER_TEMP/plugin-renders"
          docker run -d --rm --name dezfil-plugin-ci --network=none \
            -e PORT=3399 -e DEZFIL_EGRESS_ALLOWLIST=127.0.0.1 \
            -e DEZFIL_PLUGIN_RENDER_LOG=/evidence/renders.ndjson \
            -e NODE_OPTIONS=--import=/probes/dezfil-render-observer.mjs \
            -v "$PWD/scripts:/probes:ro" \
            -v "$RUNNER_TEMP/plugin-renders:/evidence" dezfil:ci
          for i in $(seq 1 30); do
            if docker exec dezfil-plugin-ci node -e "fetch('http://127.0.0.1:3399/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          docker run --rm --network=container:dezfil-plugin-ci \
            -v "$PWD/scripts:/probe/scripts:ro" \
            -v "$PWD/plugins:/probe/plugins:ro" \
            -v "$RUNNER_TEMP/plugin-renders:/evidence:ro" \
            dezfil-mcp-probe:ci node /probe/scripts/dezfil-plugin-container.mjs \
            --origin http://127.0.0.1:3399
      - name: Stop container
        if: always()
        run: docker stop dezfil-ci || true
      # An instance with no egress still boots, answers health, and renders a
      # real image export - data pixels on the documented plain background.
      # Driven from inside the container: with no network nothing outside can
      # reach it.
      - name: Offline boot and image export render data pixels
        run: |
          docker run -d --rm --name dezfil-offline --network=none \
            -e DEZFIL_RENDER_CAP_FEATURES=2000 \
            -v "$PWD/scripts:/probes:ro" dezfil:ci
          for i in $(seq 1 30); do
            if docker exec dezfil-offline node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          docker exec dezfil-offline node /probes/offline-export-probe.mjs --tiled
          docker stop dezfil-offline
      # Removing the browser must make the export fail with its own coded
      # result while health stays green. This is what proves the positive
      # export step above actually depends on the browser.
      - name: Browser-removed negative - export fails coded, health green
        run: |
          printf 'FROM dezfil:ci\nUSER root\nRUN rm /usr/bin/chromium\nUSER node\n' | docker build -t dezfil-nobrowser -f - .
          docker run -d --rm --name dezfil-nobrowser -v "$PWD/scripts:/probes:ro" dezfil-nobrowser
          for i in $(seq 1 30); do
            if docker exec dezfil-nobrowser node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          docker exec dezfil-nobrowser node /probes/offline-export-probe.mjs --expect-unavailable
          docker stop dezfil-nobrowser

      # A render timeout has its own result and cannot skip the offline gates.
      - name: Installed plugin real retained map check
        run: |
          docker run --rm --network=container:dezfil-plugin-ci \
            -v "$PWD/scripts:/probe/scripts:ro" \
            -v "$PWD/plugins:/probe/plugins:ro" \
            -v "$RUNNER_TEMP/plugin-renders:/evidence:ro" \
            dezfil-mcp-probe:ci node /probe/scripts/dezfil-plugin-container.mjs \
            --origin http://127.0.0.1:3399 --render --render-log /evidence/renders.ndjson
      - name: Stop plugin journey container
        if: always()
        run: docker stop dezfil-plugin-ci || true
