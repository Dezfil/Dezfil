name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for a security
        vulnerability: report those privately through the Security tab.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Upload the attached file
        2. Add it as a layer
        3. Change the colormap
        4. The legend shows the old range
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, the container image tag, or the commit you are on.
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it
      options:
        - The container image
        - From source, development server
        - From source, production build
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: Only if the problem is in the interface.
      placeholder: Firefox 140 on Ubuntu 24.04
  - type: textarea
    id: data
    attributes:
      label: The data involved
      description: >
        Format, rough size, geometry type, projection. Attach a small sample if
        you can share one. Please remove anything confidential first.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Server output or browser console. This is rendered as code, so no backticks needed.
      render: text
